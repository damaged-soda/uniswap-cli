name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          pytest -q -m "not live"
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import uniswap_cli; print(uniswap_cli.__version__)')"
      - name: Build
        run: python -m build
      - name: Verify distribution contents
        run: |
          unzip -l dist/*.whl | grep -F 'share/uniswap-cli/schemas/swap-0.1.schema.json'
          unzip -l dist/*.whl | grep -F 'share/uniswap-cli/skills/uniswap/SKILL.md'
          tar -tzf dist/*.tar.gz | grep -F 'tests/fixtures/rpc_v3_swap_log.json'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
