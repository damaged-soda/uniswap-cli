name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q -m "not live"
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Verify distribution contents
        if: matrix.python-version == '3.12'
        run: |
          unzip -l dist/*.whl | grep -F 'share/uniswap-cli/schemas/swap-0.1.schema.json'
          unzip -l dist/*.whl | grep -F 'share/uniswap-cli/skills/uniswap/SKILL.md'
          tar -tzf dist/*.tar.gz | grep -F 'tests/fixtures/rpc_v3_swap_log.json'
