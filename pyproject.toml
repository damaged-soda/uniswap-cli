[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniswap-cli"
version = "0.1.0"
description = "Agent-friendly read-only CLI for Uniswap market and historical data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "leavan", email = "damaged.soda@gmail.com" }]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.9",
]

[project.scripts]
uniswap = "uniswap_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: requires live upstream credentials and network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
